[package]
name = "mempooloracle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Mempool tracking and confirmation-latency oracle for EIP-1559"

[features]
default = []
reth-p2p = ["dep:reth-discv4", "dep:reth-ethereum", "dep:reth-network-peers"]
consensus-p2p = ["dep:eth2_libp2p", "dep:grandine_bls", "dep:grandine_kzg_utils", "dep:grandine_types"]

[dependencies]
alloy.workspace = true
crossterm.workspace = true
futures.workspace = true
ratatui.workspace = true
eth2_libp2p = { path = "../../third_party/grandine/eth2_libp2p", optional = true }
grandine_bls = { package = "bls", path = "../../third_party/grandine/bls", optional = true, features = ["zkcrypto"] }
grandine_kzg_utils = { package = "kzg_utils", path = "../../third_party/grandine/kzg_utils", optional = true, features = ["zkcrypto"] }
grandine_types = { package = "types", path = "../../third_party/grandine/types", optional = true }
reth-ethereum = { workspace = true, optional = true, features = ["network", "pool", "provider", "test-utils"] }
reth-discv4 = { workspace = true, optional = true }
reth-network-peers = { workspace = true, optional = true }
rustls.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

[lib]
name = "mempooloracle"
path = "src/lib.rs"
